[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "fll-governance"
version = "0.1.0"
description = "Policy-enforcement layer for LLM outputs: guardrails, compliance checks, tamper-evident audit trails."
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "Ryan Oldfield", email = "ryan@iamfaulty.com"}]
dependencies = ["PyYAML>=6.0"]

[project.optional-dependencies]
dev = ["pytest>=8.0", "httpx>=0.27"]
serve = ["fastapi>=0.110", "uvicorn>=0.29"]

[project.scripts]
fll-governance = "fll_governance.cli:main"

[tool.setuptools.packages.find]
include = ["fll_governance*"]
